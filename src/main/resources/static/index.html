<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目全流程管控系统</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 顶部导航栏 - 草绿色简约风格 */
        .header {
            height: 56px;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-logo {
            width: 32px;
            height: 32px;
            background-color: #86c566;
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo svg {
            width: 20px;
            height: 20px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #86c566;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
        }
        .user-name {
            font-size: 14px;
            color: #333;
        }
        .logout-btn {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .logout-btn:hover {
            color: #86c566;
        }
        .change-pwd-btn {
            color: #86c566;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            margin-left: 4px;
            padding: 2px 8px;
            border: 1px solid #86c566;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .change-pwd-btn:hover {
            color: #fff;
            background-color: #86c566;
        }
        .change-pwd-btn i {
            font-size: 12px;
            margin-right: 2px;
        }
        /* 个人信息弹窗样式 */
        .profile-box {
            padding: 16px 20px;
        }
        .profile-item {
            display: flex;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            line-height: 1.6;
        }
        .profile-item:last-child {
            border-bottom: none;
        }
        .profile-label {
            width: 90px;
            color: #666;
            flex-shrink: 0;
        }
        .profile-value {
            flex: 1;
            color: #333;
            word-break: break-all;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            background-color: #86c566;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            margin: 0 auto 16px;
        }
        .profile-name {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .profile-role {
            text-align: center;
            font-size: 13px;
            color: #86c566;
            margin-bottom: 12px;
        }
        /* 主内容区 */
        .main-container {
            display: flex;
            margin-top: 56px;
            height: calc(100vh - 56px - 40px);
        }
        /* 左侧菜单区域 */
        .menu-frame {
            width: 200px;
            height: 100%;
            border: none;
            border-right: 1px solid #e8e8e8;
        }
        /* 右侧内容区域 */
        .content-frame {
            flex: 1;
            height: 100%;
            border: none;
        }
        /* 底部栏 */
        .footer {
            height: 40px;
            background-color: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 13px;
        }
        /* 页面标题栏 */
        .content-header {
            height: 50px;
            background-color: #fff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .content-title {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .content-title i {
            color: #86c566;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
                    <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="header-title">浙江环龙项目全流程管控系统</div>
        </div>
        <div class="header-right">
            <div class="user-info" id="userInfo" onclick="openProfile()">
                <div class="user-avatar" id="userAvatar">用</div>
                <span class="user-name" id="userName">加载中...</span>
            </div>
            <a class="change-pwd-btn" href="javascript:openChangePwd();" title="修改密码">
                <i class="layui-icon layui-icon-password"></i> 修改密码
            </a>
            <a class="logout-btn" href="javascript:logout();">
                <i class="layui-icon layui-icon-logout" style="font-size: 18px; vertical-align: middle;"></i> 退出
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧菜单 iframe -->
        <iframe src="/sys_menu.html" class="menu-frame" frameborder="0"></iframe>
        <!-- 右侧内容 iframe -->
        <iframe src="/work_plat.html" class="content-frame" id="contentFrame" frameborder="0"></iframe>
    </div>

    <!-- 底部栏 -->
    <div class="footer">
        © 2026 浙江环龙环境保护有限公司 版权所有 | 数据科技部
    </div>

    <script src="/layui/layui.js"></script>
    <script>
    // 检查登录状态
    var token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html';
    }

    // 当前登录用户信息
    var currentUser = {};

    var positionMap = {
        '0': '董事长',
        '1': '总裁',
        '2': '副总裁',
        '3': '处长',
        '4': '副处长',
        '5': '技术学术委员会主任',
        '6': '副主任',
        '7': '处长助理',
        '8': '普通员工'
    };

    // 格式化日期
    function formatDateTime(dt) {
        if (!dt) return '-';
        var date = new Date(dt);
        if (isNaN(date.getTime())) return dt;
        var y = date.getFullYear();
        var m = (date.getMonth() + 1).toString().padStart(2, '0');
        var d = date.getDate().toString().padStart(2, '0');
        var h = date.getHours().toString().padStart(2, '0');
        var min = date.getMinutes().toString().padStart(2, '0');
        var s = date.getSeconds().toString().padStart(2, '0');
        return y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s;
    }

    // 加载当前登录用户信息
    layui.use(['jquery'], function() {
        var $ = layui.$;
        $.ajax({
            url: '/sys/user/current',
            type: 'GET',
            headers: { token: token },
            dataType: 'json',
            success: function(res) {
                if (res.code === 200 && res.data) {
                    currentUser = res.data;
                    var realName = currentUser.realName || currentUser.username || '用户';
                    document.getElementById('userName').textContent = realName;
                    document.getElementById('userAvatar').textContent = realName.substring(0, 1);
                } else if (res.code === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                } else {
                    document.getElementById('userName').textContent = '用户';
                }
            },
            error: function() {
                document.getElementById('userName').textContent = '用户';
            }
        });
    });

    // 切换内容页面
    function switchContent(url, title) {
        document.getElementById('contentFrame').src = url;
    }

    // 退出登录
    function logout() {
        layui.use(['layer'], function() {
            var layer = layui.layer;
            layer.confirm('确定要退出登录吗？', function(index) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
                layer.close(index);
            });
        });
    }

    // 打开个人信息弹窗
    function openProfile() {
        layui.use(['layer'], function() {
            var layer = layui.layer;
            var realName = currentUser.realName || currentUser.username || '用户';
            var roleNames = currentUser.roleNames && currentUser.roleNames.length > 0
                ? currentUser.roleNames.join('，') : '-';
            var deptNames = currentUser.deptNames && currentUser.deptNames.length > 0
                ? currentUser.deptNames.join('，') : '-';
            var position = positionMap[currentUser.sysPosition] || '-';
            var statusText = currentUser.status === 1 ? '正常' : (currentUser.status === 0 ? '禁用' : '-');
            var phone = currentUser.phone || '-';
            var createTime = formatDateTime(currentUser.createTime);

            var html = '<div class="profile-box">' +
                '<div class="profile-avatar">' + realName.substring(0, 1) + '</div>' +
                '<div class="profile-name">' + realName + '</div>' +
                '<div class="profile-role">' + roleNames + '</div>' +
                '<div class="profile-item"><span class="profile-label">账号</span><span class="profile-value">' + (currentUser.username || '-') + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">姓名</span><span class="profile-value">' + (currentUser.realName || '-') + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">职位</span><span class="profile-value">' + position + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">电话</span><span class="profile-value">' + phone + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">所属部门</span><span class="profile-value">' + deptNames + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">所属角色</span><span class="profile-value">' + roleNames + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">账号状态</span><span class="profile-value">' + statusText + '</span></div>' +
                '<div class="profile-item"><span class="profile-label">创建时间</span><span class="profile-value">' + createTime + '</span></div>' +
                '</div>';

            layer.open({
                type: 1,
                title: '个人信息',
                area: ['420px', 'auto'],
                shadeClose: true,
                content: html,
                btn: ['修改密码', '关闭'],
                btn1: function(index) {
                    layer.close(index);
                    openChangePwd();
                },
                btn2: function(index) {
                    layer.close(index);
                }
            });
        });
    }

    // 打开修改密码弹窗
    function openChangePwd() {
        layui.use(['layer', 'form', 'jquery'], function() {
            var layer = layui.layer;
            var form = layui.form;
            var $ = layui.$;

            var html = '<div class="layui-form" style="padding: 20px 30px 10px;">' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">旧密码</label>' +
                '<div class="layui-input-block">' +
                '<input type="password" id="oldPassword" name="oldPassword" placeholder="请输入旧密码" autocomplete="off" class="layui-input">' +
                '</div></div>' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">新密码</label>' +
                '<div class="layui-input-block">' +
                '<input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码（至少6位）" autocomplete="off" class="layui-input">' +
                '</div></div>' +
                '<div class="layui-form-item">' +
                '<label class="layui-form-label">确认新密码</label>' +
                '<div class="layui-input-block">' +
                '<input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码" autocomplete="off" class="layui-input">' +
                '</div></div>' +
                '</div>';

            layer.open({
                type: 1,
                title: '修改密码',
                area: ['420px', 'auto'],
                shadeClose: false,
                content: html,
                btn: ['保存', '取消'],
                yes: function(index) {
                    var oldPassword = $('#oldPassword').val().trim();
                    var newPassword = $('#newPassword').val().trim();
                    var confirmPassword = $('#confirmPassword').val().trim();

                    if (!oldPassword) {
                        layer.msg('请输入旧密码', { icon: 2 });
                        return;
                    }
                    if (!newPassword) {
                        layer.msg('请输入新密码', { icon: 2 });
                        return;
                    }
                    if (newPassword.length < 6) {
                        layer.msg('新密码长度不能少于6位', { icon: 2 });
                        return;
                    }
                    if (newPassword !== confirmPassword) {
                        layer.msg('两次输入的新密码不一致', { icon: 2 });
                        return;
                    }

                    $.ajax({
                        url: '/sys/user/changePassword',
                        type: 'POST',
                        headers: { token: token },
                        contentType: 'application/json',
                        data: JSON.stringify({
                            oldPassword: oldPassword,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        }),
                        dataType: 'json',
                        success: function(res) {
                            if (res.code === 200) {
                                layer.msg(res.msg || '密码修改成功', { icon: 1 });
                                layer.close(index);
                            } else {
                                layer.msg(res.msg || '密码修改失败', { icon: 2 });
                            }
                        },
                        error: function() {
                            layer.msg('网络异常，请稍后重试', { icon: 2 });
                        }
                    });
                }
            });
        });
    }
    </script>
</body>
</html>
